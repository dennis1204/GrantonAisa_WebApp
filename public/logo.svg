<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <!-- Premium metallic gold linear gradients -->
    <linearGradient id="gaGoldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="gaGoldSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="40%" stop-color="#EAB308" />
      <stop offset="80%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="gaGoldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <radialGradient id="gaGoldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <filter id="gaShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient background glow behind emblem -->
  <circle cx="50" cy="50" r="44" fill="url(#gaGoldGlow)" />

  <!-- Emblem Group -->
  <g transform="translate(10, 10)" filter="url(#gaShadow)">
    <!-- Outer primary flowing loop / arc (G sweep) -->
    <path
      d="M40,5 C59.33,5 75,20.67 75,40 C75,54.8 65.8,67.5 52.8,72.6 C46.5,75 39.8,75 33.5,73 C20.5,68.8 10.8,57.7 8.5,44.2 C7.5,38.2 8.4,32 11.2,26.5 C12.5,23.8 16.5,25.2 15.3,27.9 C13.1,32.7 12.3,38.1 13.2,43.4 C15.2,55.3 23.7,65.1 35.1,68.7 C40.6,70.5 46.5,70.5 52,68.4 C63.2,63.9 71,52.8 71,40 C71,22.88 57.12,9 40,9 C26.8,9 15.4,17.2 11.2,29.5 C10.4,31.9 6.8,30.7 7.6,28.2 C12.4,14.6 25.2,5 40,5 Z"
      fill="url(#gaGoldPrimary)"
    />

    <!-- Interlocking dynamic ribbon / wave curve -->
    <path
      d="M40,16 C53.25,16 64,26.75 64,40 C64,50.2 57.6,58.9 48.6,62.3 C44.2,64 39.5,64 35.1,62.6 C26.3,59.8 19.8,52.2 18.2,43 C17.5,39 18.2,34.8 20.1,31.1 C21.1,29.1 18.2,27.5 17.2,29.5 C15,33.8 14.1,38.8 15,43.5 C16.9,54.2 24.5,63 34.8,66.3 C40,68 45.5,68 50.7,66 C61.2,62 68,51.8 68,40 C68,24.54 55.46,12 40,12 C28.2,12 18,19.3 14.2,30.2 C13.1,33.3 8.5,31.6 9.6,28.5 C14,15.8 26,6.5 40,6.5"
      fill="url(#gaGoldSecondary)"
      opacity="0.95"
    />

    <!-- Inner prosperity coin / jewel geometric core -->
    <path
      d="M40,24 C48.8,24 56,31.2 56,40 C56,48.8 48.8,56 40,56 C31.2,56 24,48.8 24,40 C24,31.2 31.2,24 40,24 Z M40,28 C33.4,28 28,33.4 28,40 C28,46.6 33.4,52 40,52 C46.6,52 52,46.6 52,40 C52,33.4 46.6,28 40,28 Z"
      fill="url(#gaGoldAccent)"
    />

    <!-- Central diamond / prosperity spark -->
    <polygon points="40,34 44.5,40 40,46 35.5,40" fill="url(#gaGoldPrimary)" />
  </g>

  <!-- Typography: Chinese Brand Name -->
  <text x="110" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang HK', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="900" fill="#0f172a" letter-spacing="1.5">
    盈滙亞洲有限公司
  </text>

  <!-- Typography: English Brand Name -->
  <text x="111" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#64748b" letter-spacing="3.2">
    GRANTON ASIA LIMITED
  </text>
</svg>
